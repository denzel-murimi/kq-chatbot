# Render deployment blueprint for the Kenya Airways assistant backend (FastAPI).
# Place at the repository root. Secrets (sync: false) are entered in the Render
# dashboard, not committed. Render serves the service over HTTPS, which the
# HTTPS frontend requires to call it without mixed-content blocking.
services:
  - type: web
    name: kq-chatbot-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      # --- secrets: set these in the Render dashboard ---
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL          # the Supabase transaction-pooler URL
        sync: false
      - key: ADMIN_KEY             # the admin-UI key
        sync: false
      - key: CORS_ORIGINS          # e.g. https://your-app.vercel.app,http://localhost:3000
        sync: false